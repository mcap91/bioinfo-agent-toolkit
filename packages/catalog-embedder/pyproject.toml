[project]
name = "catalog-embedder"
version = "0.1.0"
description = "Survey search: complete lexical sweep + semantic rescue over catalog entries"
requires-python = ">=3.10"
dependencies = [
    "fastembed>=0.3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_embedder"]
