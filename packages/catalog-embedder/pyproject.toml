[project]
name = "catalog-embedder"
version = "0.1.0"
description = "CLI for building fastembed vectors and running hybrid lexical+semantic search over the catalog."
requires-python = ">=3.10"
dependencies = [
    "fastembed>=0.3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_embedder"]
